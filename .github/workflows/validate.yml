name: Validate Antigravity Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Skills Validator
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh
